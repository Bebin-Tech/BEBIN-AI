services:
  postgres:
    image: postgres:16-alpine
    container_name: bebin-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bebin_ai}
      POSTGRES_USER: ${POSTGRES_USER:-bebin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bebin} -d ${POSTGRES_DB:-bebin_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

