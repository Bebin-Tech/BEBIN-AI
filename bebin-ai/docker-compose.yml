services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bebin-ai-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bebin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-bebin_ai}
      MODEL_TOKENIZER_PATH: ${MODEL_TOKENIZER_PATH:-artifacts/tokenizer/tokenizer.json}
      MODEL_CHECKPOINT_PATH: ${MODEL_CHECKPOINT_PATH:-artifacts/runs/smoke/last.pt}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bebin-ai-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: bebin-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bebin_ai}
      POSTGRES_USER: ${POSTGRES_USER:-bebin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bebin} -d ${POSTGRES_DB:-bebin_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
